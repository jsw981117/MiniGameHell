<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tower Defense Runner - Mini Game Hell</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 상단 UI -->
        <div class="top-ui">
            <div class="score">
                점수: <span id="scoreValue">0</span>
            </div>
            <button id="settingsBtn" class="settings-btn" title="설정">⚙️</button>
        </div>

        <!-- 게임 캔버스 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 컨트롤 버튼 -->
        <div class="controls">
            <button id="startBtn" class="btn btn-start">게임 시작</button>
            <button id="pauseBtn" class="btn btn-pause">일시정지</button>
            <button id="resetBtn" class="btn btn-reset">재시작</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>게임 설정</h2>

            <div class="settings-section">
                <h3>타워 설정</h3>
                <div class="setting-item">
                    <label for="towerWidth">너비 (px):</label>
                    <input type="number" id="towerWidth" min="40" max="120" step="5">
                </div>
                <div class="setting-item">
                    <label for="towerHeight">높이 (px):</label>
                    <input type="number" id="towerHeight" min="40" max="120" step="5">
                </div>
                <div class="setting-item">
                    <label for="towerInitialHp">초기 체력:</label>
                    <input type="number" id="towerInitialHp" min="50" max="500" step="10">
                </div>
                <div class="setting-item">
                    <label for="towerMaxHp">최대 체력:</label>
                    <input type="number" id="towerMaxHp" min="50" max="500" step="10">
                </div>
                <div class="setting-item">
                    <label for="towerHpDecayRate">체력 감소율 (HP/s):</label>
                    <input type="number" id="towerHpDecayRate" min="0" max="5" step="0.1">
                </div>
                <div class="setting-item">
                    <label for="towerEnemyDamage">적 공격 데미지:</label>
                    <input type="number" id="towerEnemyDamage" min="1" max="50" step="1">
                </div>
                <div class="setting-item">
                    <label for="towerShootInterval">사격 주기 (초):</label>
                    <input type="number" id="towerShootInterval" min="0.1" max="3" step="0.1">
                </div>
            </div>

            <div class="settings-section">
                <h3>투사체 설정</h3>
                <div class="setting-item">
                    <label for="projectileWidth">너비 (px):</label>
                    <input type="number" id="projectileWidth" min="5" max="30" step="1">
                </div>
                <div class="setting-item">
                    <label for="projectileHeight">높이 (px):</label>
                    <input type="number" id="projectileHeight" min="5" max="30" step="1">
                </div>
                <div class="setting-item">
                    <label for="projectileSpeed">속도 (px/s):</label>
                    <input type="number" id="projectileSpeed" min="200" max="1000" step="50">
                </div>
            </div>

            <div class="settings-section">
                <h3>플레이어 설정</h3>
                <div class="setting-item">
                    <label for="playerWidth">너비 (px):</label>
                    <input type="number" id="playerWidth" min="20" max="100" step="5">
                </div>
                <div class="setting-item">
                    <label for="playerHeight">높이 (px):</label>
                    <input type="number" id="playerHeight" min="20" max="100" step="5">
                </div>
                <div class="setting-item">
                    <label for="playerMaxJumps">최대 점프 횟수 (-1: 무제한):</label>
                    <input type="number" id="playerMaxJumps" min="-1" max="10" step="1">
                </div>
                <div class="setting-item">
                    <label for="playerSpeed">이동 속도 (px/s):</label>
                    <input type="number" id="playerSpeed" min="100" max="1000" step="50">
                </div>
                <div class="setting-item">
                    <label for="playerJumpForce">점프력 (px):</label>
                    <input type="number" id="playerJumpForce" min="200" max="1000" step="50">
                </div>
                <div class="setting-item">
                    <label for="playerGravity">중력:</label>
                    <input type="number" id="playerGravity" min="500" max="3000" step="100">
                </div>
            </div>

            <div class="settings-section">
                <h3>별 설정</h3>
                <div class="setting-item">
                    <label for="starSize">크기 (px):</label>
                    <input type="number" id="starSize" min="15" max="60" step="5">
                </div>
                <div class="setting-item">
                    <label for="starHealAmount">타워 회복량:</label>
                    <input type="number" id="starHealAmount" min="1" max="50" step="1">
                </div>
            </div>

            <div class="settings-section">
                <h3>적 설정</h3>
                <div class="setting-item">
                    <label for="enemyWidth">너비 (px):</label>
                    <input type="number" id="enemyWidth" min="20" max="100" step="5">
                </div>
                <div class="setting-item">
                    <label for="enemyHeight">높이 (px):</label>
                    <input type="number" id="enemyHeight" min="20" max="100" step="5">
                </div>
                <div class="setting-item">
                    <label for="enemyHp">체력:</label>
                    <input type="number" id="enemyHp" min="1" max="10" step="1">
                </div>
                <div class="setting-item">
                    <label for="enemyMinSpeed">최소 낙하 속도 (px/s):</label>
                    <input type="number" id="enemyMinSpeed" min="50" max="500" step="50">
                </div>
                <div class="setting-item">
                    <label for="enemyMaxSpeed">최대 낙하 속도 (px/s):</label>
                    <input type="number" id="enemyMaxSpeed" min="200" max="1000" step="50">
                </div>
                <div class="setting-item">
                    <label for="enemyGroundSpeedMult">지상 이동 속도 배율:</label>
                    <input type="number" id="enemyGroundSpeedMult" min="0.1" max="1.5" step="0.05">
                </div>
                <div class="setting-item">
                    <label for="enemyInitialInterval">초기 생성 주기 (초):</label>
                    <input type="number" id="enemyInitialInterval" min="0.5" max="5" step="0.1">
                </div>
                <div class="setting-item">
                    <label for="enemyMinInterval">최소 생성 주기 (초):</label>
                    <input type="number" id="enemyMinInterval" min="0.1" max="2" step="0.1">
                </div>
                <div class="setting-item">
                    <label for="enemyDecreaseRate">난이도 증가율:</label>
                    <input type="number" id="enemyDecreaseRate" min="0.9" max="1.0" step="0.01">
                </div>
            </div>

            <div class="settings-section">
                <h3>회복 설정</h3>
                <div class="setting-item">
                    <label for="healEnemyKill">적 처치 시 회복량:</label>
                    <input type="number" id="healEnemyKill" min="1" max="50" step="1">
                </div>
            </div>

            <div class="modal-buttons">
                <button id="applySettings" class="btn btn-apply">적용</button>
                <button id="cancelSettings" class="btn btn-cancel">취소</button>
                <button id="resetSettings" class="btn btn-default">기본값 복원</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 파일들 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/Tower.js"></script>
    <script src="js/Projectile.js"></script>
    <script src="js/Player.js"></script>
    <script src="js/Star.js"></script>
    <script src="js/Enemy.js"></script>
    <script src="js/game.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
